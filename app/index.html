<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<meta name="viewport"  content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">  <title>Mach Five Magnet</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="icon" type="image/x-icon" href="./favicon.ico">

  <!-- Google Fonts: brand (Google Sans Flex + Inter) + Neodigm (Roboto + Material Symbols) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Google+Sans+Flex:wght@400;500;600;700&display=swap">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@100;300;400&family=Roboto+Slab:wght@300;400;500;600;700&family=Roboto+Mono:wght@300&family=Material+Symbols+Outlined&display=block">
  <link rel="stylesheet" type="text/css" requestor="Neodigm 55" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@100;300;400&family=Roboto+Slab:wght@300;400;500;600;700&family=Roboto+Mono:wght@300&family=Material+Symbols+Outlined&display=block" crossorigin="anonymous">

  <!-- Neodigm 55 UX Library -->
  <link rel="stylesheet" href="https://arcanus55.github.io/neodigm55/dist/neodigm55__v5_0.css">

  <!-- App shell layout: left side-nav (fixed, inside m5t-side-nav shadow DOM) + a content
       column (contextual top sub-nav + #app). The column only reserves room for the
       sidebar when the nav is shown (authenticated routes). -->
  <style>
    /* The authenticated app is light. launCh's global base is dark
       (body { background: var(--color-gray-500); color-scheme: dark }) — auth pages
       escape it via .auth-container; the app shell does the same here so section
       pages render on a light surface instead of the gray body bleeding through. */
    #app-shell {
      min-height: 100vh;
      background: var(--color-surface, #F4F7FB);
      color: var(--color-text, #0B1220);
      color-scheme: light;
    }
    /* Dark mode toggle (main.js) sets data-theme="dark" on <html> — without this,
       #app-shell's own color-scheme:light above would keep pinning native form
       controls/scrollbars to light even after the color tokens flip to dark. */
    html[data-theme="dark"] #app-shell { color-scheme: dark; }
    /* Authoritative content gutter (high-specificity + unlayered so it can't lose to
       the global `* { padding: 0 }` reset). Section pages wrap content in .page-shell. */
    #app-shell .page-shell { padding: 40px 48px; }
    #app-shell.has-side-nav #app-content {
      margin-left: var(--sidenav-width, 260px);
      transition: margin-left 0.2s ease;
    }
    #app-shell.has-side-nav.nav-collapsed #app-content {
      margin-left: var(--sidenav-width-collapsed, 68px);
    }
    @media (max-width: 768px) {
      #app-shell.has-side-nav #app-content { margin-left: 0; }
      #app-shell .page-shell { padding: 24px 20px; }
      /* Leave a gutter for the floating hamburger when a sub-nav is showing. */
      #app-shell.has-side-nav.has-sub-nav #m5t-sub-nav { padding-left: 56px; }
      /* Drop the sub-nav below the side-nav drawer (z-90) + scrim (z-88) so the open
         drawer overlays/dims it like the rest of the content (hamburger stays on top). */
      #m5t-sub-nav { z-index: 80; }
    }

    /* Notification bell — deliberately its own plain element, not part of either nav
       web component: persistent regardless of which section has sub-items (unlike
       #m5t-sub-nav, which is hidden on many routes), and independent of client-sse-
       console (which doesn't use this app-shell at all). Shown/hidden by main.js the
       same way m5t-side-nav is (authenticated routes only). `top: 14px` here is only
       the DEFAULT — core/notificationBell.js's alignNotifBellToBanner() overrides it
       via inline style (ResizeObserver-driven) to stay centered against the
       org-context-banner's own buttons whenever that banner is showing, since the
       banner's height (and even which line its buttons land on, once it wraps) isn't
       a fixed value this stylesheet can know in advance. */
    #m5t-notif-bell { position: fixed; top: 14px; right: 20px; z-index: 90; }
    #m5t-notif-bell-btn { position: relative; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--color-border, #D4DCE8); background: var(--color-bg, #fff); color: var(--color-text-muted, #4A5A78); cursor: pointer; display: grid; place-items: center; box-shadow: var(--shadow-sm, 0 1px 3px rgba(11,18,32,0.08)); }
    #m5t-notif-bell-btn:hover { color: var(--color-primary-600, #0072BA); border-color: var(--color-primary-600, #0072BA); }
    #m5t-notif-badge { position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--color-danger-strong, #DC2626); color: #fff; font-size: 0.62rem; font-weight: 700; line-height: 16px; text-align: center; }
    #m5t-notif-badge[hidden] { display: none; }
    #m5t-notif-panel { position: absolute; top: 48px; right: 0; width: min(360px, 90vw); max-height: 70vh; overflow-y: auto; background: var(--color-bg, #fff); border: 1px solid var(--color-border, #D4DCE8); border-radius: 12px; box-shadow: var(--shadow-md, 0 8px 24px rgba(11,18,32,0.16)); }
    #m5t-notif-panel[hidden] { display: none; }
    .m5t-notif-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--color-border, #D4DCE8); font-weight: 700; font-size: 0.86rem; }
    .m5t-notif-markall { appearance: none; border: 0; background: transparent; color: var(--color-primary-600, #0072BA); font: inherit; font-size: 0.76rem; font-weight: 600; cursor: pointer; }
    .m5t-notif-item { display: block; padding: 12px 14px; border-bottom: 1px solid var(--color-surface-2, #EAF0F7); text-decoration: none; color: inherit; }
    .m5t-notif-item:last-child { border-bottom: 0; }
    .m5t-notif-item:hover { background: var(--color-surface, #F7FAFD); }
    .m5t-notif-item[data-read="false"] { background: var(--color-accent-soft, rgba(0,114,186,0.06)); }
    .m5t-notif-title { font-weight: 600; font-size: 0.86rem; margin-bottom: 2px; }
    .m5t-notif-body { font-size: 0.78rem; color: var(--color-text-muted, #4A5A78); line-height: 1.4; }
    .m5t-notif-time { font-size: 0.7rem; color: var(--color-text-subtle, #6C7C9A); margin-top: 4px; }
    .m5t-notif-empty { padding: 24px 14px; text-align: center; font-size: 0.82rem; color: var(--color-text-subtle, #6C7C9A); }
  </style>
  <script type="module" crossorigin src="assets/index_9fe91e1a.js"></script>
  <link rel="stylesheet" crossorigin href="assets/index_9fe91e1a.css">
</head>
<body>
  <div id="app-shell">
    <!-- Persona-aware left navigation (web component, lives OUTSIDE #app so route
         renders never destroy it). Hidden until an authenticated route shows it. -->
    <m5t-side-nav id="m5t-side-nav" hidden></m5t-side-nav>
    <div id="m5t-notif-bell" hidden>
      <button id="m5t-notif-bell-btn" type="button" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
        <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
        <span id="m5t-notif-badge" hidden>0</span>
      </button>
      <div id="m5t-notif-panel" role="menu" hidden></div>
    </div>
    <div id="app-content">
      <!-- Contextual top sub-nav: shown only when the active section has sub-items.
           Reuses m5t-primary-nav (logo hidden; the side-nav owns the brand mark). -->
      <m5t-primary-nav id="m5t-sub-nav" data-show-secondary="false" data-hide-logo="true" hidden></m5t-primary-nav>
      <div id="app"></div>
    </div>
  </div>

  <!-- Neodigm 55 Configuration and Library -->
  <!-- Must load BEFORE our module scripts to ensure mvvLegit is available -->
  <script>
    // DEBUG: Check localStorage BEFORE anything loads
    console.log('[DEBUG] Page load - mvv before neodigm:', localStorage.getItem('mvv') ? 'EXISTS' : 'NULL');

    // Neodigm 55 configuration - minimal config to match working apps
    let neodigmOptCustom = { mvvLegit: true };
  </script>
  <script
    src="https://arcanus55.github.io/neodigm55/dist/neodigm55__v5_0.js"
    onload="window.__neodigmLoaded = true; console.log('[Neodigm] Library loaded successfully'); console.log('[DEBUG] After neodigm load - mvv:', localStorage.getItem('mvv') ? 'EXISTS' : 'NULL');"
    onerror="console.error('[Neodigm] Failed to load library from CDN');"
  ></script>

  <script>
    // DEBUG: Check localStorage AFTER neodigm loads but BEFORE main.js
    console.log('[DEBUG] Before main.js - mvv:', localStorage.getItem('mvv') ? 'EXISTS' : 'NULL');
  </script>

  <!-- Application Entry Point -->
</body>
</html>
