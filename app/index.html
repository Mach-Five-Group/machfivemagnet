  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@100;300;400&family=Roboto+Slab:wght@300;400;500;600;700&family=Roboto+Mono:wght@300&family=Material+Symbols+Outlined&display=block">

  <!-- App shell layout: left side-nav (fixed, inside m5t-side-nav shadow DOM) + a content
       column (contextual top sub-nav + #app). The column only reserves room for the
       sidebar when the nav is shown (authenticated routes). -->
  <style>
    /* The authenticated app is light. launCh's global base is dark
       (body { background: var(--color-gray-500); color-scheme: dark }) — auth pages
       escape it via .auth-container; the app shell does the same here so section
       pages render on a light surface instead of the gray body bleeding through. */
    /* THE APP SHELL DOES NOT SCROLL — the content pane inside it does.
       The chrome (side nav, org-context banner, contextual top bar) stays put and #app
       gets its own scrollport, which is how Gmail/Stripe keep a header from ever covering
       content. The previous arrangement scrolled the whole document under a
       position:sticky bar, so page headings passed underneath it; reserving space with
       padding does not fix that, because a sticky bar already occupies flow space at rest
       and the content simply scrolls past it anyway (measured before this change).
       100dvh, with 100vh first as the fallback: on iOS Safari 100vh is the LARGEST
       viewport (toolbars retracted), so a 100vh shell is taller than the visible area and
       the bottom of the pane sits under the browser chrome. dvh tracks the actual box. */
    #app-shell {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--color-surface, #F4F7FB);
      color: var(--color-text, #0B1220);
      color-scheme: light;
    }
    /* Column: banner (when shown) and the top bar keep their height, #app takes the rest.
       min-height:0 on both — a flex child will not shrink below its content without it,
       which would push the pane past the shell and restore the very overflow this
       removes. */
    #app-content { display: flex; flex-direction: column; height: 100%; min-height: 0; }
    #app { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; }
    /* Dark mode toggle (main.js) sets data-theme="dark" on <html> — without this,
       #app-shell's own color-scheme:light above would keep pinning native form
       controls/scrollbars to light even after the color tokens flip to dark. */
    html[data-theme="dark"] #app-shell { color-scheme: dark; }
    /* Authoritative content gutter (high-specificity + unlayered so it can't lose to
       the global `* { padding: 0 }` reset). Section pages wrap content in .page-shell. */
    #app-shell .page-shell { padding: 40px 48px; }
    #app-shell.has-side-nav #app-content {
      margin-left: var(--sidenav-width, 260px);
      transition: margin-left 0.2s ease;
    }
    #app-shell.has-side-nav.nav-collapsed #app-content {
      margin-left: var(--sidenav-width-collapsed, 68px);
    }
    @media (max-width: 768px) {
      #app-shell.has-side-nav #app-content { margin-left: 0; }
      #app-shell .page-shell { padding: 24px 20px; }
      /* Leave a gutter for the floating hamburger when a sub-nav is showing. */
      #app-shell.has-side-nav.has-sub-nav #m5t-sub-nav { padding-left: 56px; }
      /* Drop the sub-nav below the side-nav drawer (z-90) + scrim (z-88) so the open
         drawer overlays/dims it like the rest of the content (hamburger stays on top). */
      #m5t-sub-nav { z-index: 80; }
    }

    /* Notification bell — deliberately its own plain element, not part of either nav
       web component: persistent regardless of which section has sub-items (unlike
       #m5t-sub-nav, which is hidden on many routes), and independent of client-sse-
       console (which doesn't use this app-shell at all). Shown/hidden by main.js the
       same way m5t-side-nav is (authenticated routes only). `top: 14px` here is only
       the DEFAULT — core/notificationBell.js's alignNotifBellToBanner() overrides it
       via inline style (ResizeObserver-driven) to stay centered against the
       org-context-banner's own buttons whenever that banner is showing, since the
       banner's height (and even which line its buttons land on, once it wraps) isn't
       a fixed value this stylesheet can know in advance. */
    /* Above the sticky sub-nav (z-index 1000), not below it. The bell's 14-54px band
       sits entirely inside the bar's 0-61px band, so at z-index 90 it was painted behind
       the bar on every page that shows one — invisible and unclickable. */
    /* Bell geometry as tokens, because the nav needs to reserve exactly this much room
       at its right end and a second hardcoded copy of these numbers is how the gutter
       silently stops matching the bell. notificationBell.js does NOT duplicate the size —
       it measures the button (getBoundingClientRect) — so these two rules are the only
       place the bell's box is stated. */
    #app-shell { --m5t-bell-right: 20px; --m5t-bell-size: 40px; }
    #m5t-notif-bell { position: fixed; top: 14px; right: var(--m5t-bell-right); z-index: 1100; }
    /* THE GUTTER. The bell is fixed at the viewport's right edge and the sub-nav's right
       edge is the same edge, so without this the last tab runs underneath it: on Settings
       (5 tabs) the "Notifications" label was visibly truncated, and on every tabbed
       section ~40px of the last tab's hit area was dead — elementFromPoint at the bell's
       centre returned the bell, not the tab.
       Spatial, NOT a stacking change: z-index 1100 is deliberate (see below) and lowering
       it regresses the bell to invisible-and-unclickable behind the bar.
       Scoped to .has-side-nav because that class is toggled by the same boolean as the
       bell's own visibility (updateSideNavForRoute), so the gutter exists exactly when
       the bell does — and never in client-sse-console, which reuses this component but
       has no bell and does not use this shell. */
    #app-shell.has-side-nav #m5t-sub-nav {
      --m5t-nav-end-gutter: calc(var(--m5t-bell-right) + var(--m5t-bell-size) + 8px);
    }
    #m5t-notif-bell-btn { position: relative; width: var(--m5t-bell-size); height: var(--m5t-bell-size); border-radius: 50%; border: 1px solid var(--color-border, #D4DCE8); background: var(--color-bg, #fff); color: var(--color-text-muted, #4A5A78); cursor: pointer; display: grid; place-items: center; box-shadow: var(--shadow-sm, 0 1px 3px rgba(11,18,32,0.08)); }
    #m5t-notif-bell-btn:hover { color: var(--color-primary-600, #0072BA); border-color: var(--color-primary-600, #0072BA); }
    #m5t-notif-badge { position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--color-danger-strong, #DC2626); color: #fff; font-size: 0.62rem; font-weight: 700; line-height: 16px; text-align: center; }
    #m5t-notif-badge[hidden] { display: none; }
    /* Open/close is animated, so visibility (transitionable, and still removed from the
       a11y tree and tab order) replaces the old `hidden` attribute, which is display:none
       and cannot transition. transform-origin sits under the bell so the panel grows out
       of the button it belongs to rather than appearing fully formed on top of it. */
    #m5t-notif-panel { position: absolute; top: 48px; right: 0; width: min(360px, 90vw); max-height: 70vh; overflow-y: auto; background: var(--color-bg, #fff); border: 1px solid var(--color-border, #D4DCE8); border-radius: 14px; box-shadow: var(--shadow-md, 0 12px 32px rgba(11,18,32,0.14)), 0 2px 6px rgba(11,18,32,0.06); opacity: 0; visibility: hidden; transform: translateY(-6px) scale(0.97); transform-origin: top right; transition: opacity .16s ease, transform .18s cubic-bezier(.2,.8,.3,1), visibility 0s linear .18s; }
    #m5t-notif-panel[data-open="true"] { opacity: 1; visibility: visible; transform: none; transition: opacity .16s ease, transform .18s cubic-bezier(.2,.8,.3,1), visibility 0s; }
    /* Caret tying the panel back to the bell. */
    #m5t-notif-panel::before { content: ""; position: absolute; top: -6px; right: 14px; width: 11px; height: 11px; background: var(--color-bg, #fff); border-left: 1px solid var(--color-border, #D4DCE8); border-top: 1px solid var(--color-border, #D4DCE8); transform: rotate(45deg); border-radius: 3px 0 0 0; }
    html.ff-no-animations #m5t-notif-panel, html.ff-no-animations #m5t-notif-panel[data-open="true"] { transition: none; }
    @media (prefers-reduced-motion: reduce) { #m5t-notif-panel, #m5t-notif-panel[data-open="true"] { transition: none; } }

    .m5t-notif-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--color-border, #D4DCE8); font-weight: 700; font-size: 0.86rem; position: sticky; top: 0; background: var(--color-bg, #fff); z-index: 1; }
    .m5t-notif-head__actions { display: inline-flex; align-items: center; gap: 10px; }
    .m5t-notif-markall, .m5t-notif-clearall { appearance: none; border: 0; background: transparent; font: inherit; font-size: 0.76rem; font-weight: 600; cursor: pointer; padding: 2px; border-radius: 6px; }
    .m5t-notif-markall { color: var(--color-primary-600, #0072BA); }
    .m5t-notif-markall:hover { text-decoration: underline; }
    .m5t-notif-clearall { color: var(--color-text-subtle, #6C7C9A); }
    .m5t-notif-clearall:hover { color: var(--color-danger-strong, #DC2626); }

    /* Grid, not block: the dismiss control gets its own column so it can never overlap a
       long title the way an absolutely-positioned one would. */
    .m5t-notif-item { display: grid; grid-template-columns: 1fr auto; column-gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--color-surface-2, #EAF0F7); text-decoration: none; color: inherit; transition: background .14s ease, opacity .18s ease, transform .18s ease; }
    /* Restated because display:grid above beats the UA's [hidden] rule, and
       core/listExpand.js hides capped rows with setAttribute('hidden') — the
       notification panel is capped at core/notificationBell.js. */
    .m5t-notif-item[hidden] { display: none; }
    .m5t-notif-item:last-child { border-bottom: 0; }
    .m5t-notif-item:hover { background: var(--color-surface, #F7FAFD); }
    .m5t-notif-item[data-read="false"] { background: var(--color-accent-soft, rgba(0,114,186,0.06)); }
    /* Leaving state for a single dismissal, so the row slides out instead of vanishing. */
    .m5t-notif-item[data-leaving="true"] { opacity: 0; transform: translateX(12px); pointer-events: none; }
    html.ff-no-animations .m5t-notif-item { transition: none; }
    @media (prefers-reduced-motion: reduce) { .m5t-notif-item { transition: none; } }
    .m5t-notif-main { grid-column: 1; min-width: 0; }
    .m5t-notif-link { text-decoration: none; color: inherit; display: block; }
    .m5t-notif-link:hover .m5t-notif-title { text-decoration: underline; }
    .m5t-notif-title { font-weight: 600; font-size: 0.86rem; margin-bottom: 2px; }
    .m5t-notif-body { font-size: 0.78rem; color: var(--color-text-muted, #4A5A78); line-height: 1.4; }
    .m5t-notif-time { font-size: 0.7rem; color: var(--color-text-subtle, #6C7C9A); margin-top: 4px; }
    /* A labelled control, not a glyph. Matches .m5t-notif-clearall's type scale exactly,
       because it is the same verb at a different scope and should read that way. Sized by
       its padding rather than a fixed 24px box, so the label is never clipped. */
    .m5t-notif-dismiss { grid-column: 2; grid-row: 1 / -1; align-self: start; appearance: none; border: 0; background: transparent; color: var(--color-text-subtle, #6C7C9A); cursor: pointer; padding: 3px 8px; border-radius: 999px; font: inherit; font-size: 0.72rem; font-weight: 600; line-height: 1.4; white-space: nowrap; opacity: 0; transition: opacity .14s ease, background .14s ease, color .14s ease; }
    .m5t-notif-item:hover .m5t-notif-dismiss, .m5t-notif-dismiss:focus-visible { opacity: 1; }
    /* Deliberately NOT the danger red that .m5t-notif-clearall uses. Clearing one row is
       reversible-feeling and routine; clearing every row at once is the one that should
       give you pause. Same verb, different weight of consequence. */
    .m5t-notif-dismiss:hover { background: var(--color-surface-2, #EAF0F7); color: var(--color-primary-600, #0072BA); }
    /* Touch has no hover — never hide the only way to clear a row on a phone. */
    @media (hover: none) { .m5t-notif-dismiss { opacity: 1; } }
    .m5t-notif-empty { padding: 24px 14px; text-align: center; font-size: 0.82rem; color: var(--color-text-subtle, #6C7C9A); }

    /* Skeleton rows while loading: the panel opens into its real shape instead of
       flashing a centred "Loading…" and then reflowing into a list. */
    .m5t-notif-skel { padding: 12px 14px; border-bottom: 1px solid var(--color-surface-2, #EAF0F7); }
    .m5t-notif-skel span { display: block; height: 9px; border-radius: 999px; background: var(--color-surface-2, #EAF0F7); animation: m5t-notif-shimmer 1.3s ease-in-out infinite; }
    .m5t-notif-skel span + span { margin-top: 7px; }
    .m5t-notif-skel span:nth-child(1) { width: 62%; }
    .m5t-notif-skel span:nth-child(2) { width: 88%; }
    .m5t-notif-skel span:nth-child(3) { width: 34%; }
    @keyframes m5t-notif-shimmer { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    html.ff-no-animations .m5t-notif-skel span { animation: none; }
    @media (prefers-reduced-motion: reduce) { .m5t-notif-skel span { animation: none; } }
  </style>

  <link rel="stylesheet" crossorigin href="assets/index_563a82a2.css">

<body>
  <div id="app-shell">
    <!-- Persona-aware left navigation (web component, lives OUTSIDE #app so route
         renders never destroy it). Hidden until an authenticated route shows it. -->
    <m5t-side-nav id="m5t-side-nav" hidden></m5t-side-nav>
    <div id="m5t-notif-bell" hidden>
      <button id="m5t-notif-bell-btn" type="button" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
        <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
        <span id="m5t-notif-badge" hidden>0</span>
      </button>
      <!-- Closed state is data-open="false" rather than the `hidden` attribute, so the
           open/close can transition (see the panel's CSS above). -->
      <div id="m5t-notif-panel" role="menu" data-open="false"></div>
    </div>
    <div id="app-content">
      <!-- Contextual top sub-nav: shown only when the active section has sub-items.
           Reuses m5t-primary-nav (logo hidden; the side-nav owns the brand mark). -->
      <m5t-primary-nav id="m5t-sub-nav" data-show-secondary="false" data-hide-logo="true" hidden></m5t-primary-nav>
      <div id="app"></div>
    </div>
  </div>

  <!-- Neodigm 55 Configuration and Library -->

  ></script>
